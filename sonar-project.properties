# SonarCloud (Automatic Analysis) — configuración a nivel de monorepo.
#
# Excluye del análisis de duplicación (CPD) los archivos de configuración
# boilerplate que Angular CLI/Native Federation generan casi idénticos en
# cada app hermana (apps/portal-cliente, apps/panel-admin, apps/pwa-logistica,
# apps/shell): eslint.config.js, tsconfig*.json, angular.json, y el
# playwright.config.ts de cada e2e-bdd/. Duplicar este boilerplate entre
# proyectos Angular CLI independientes es esperado y no representa deuda
# técnica real — a diferencia de duplicar lógica de aplicación, que el
# Quality Gate sigue detectando normalmente en el resto del código.
sonar.cpd.exclusions=**/eslint.config.js,**/tsconfig*.json,**/angular.json,**/e2e-bdd/playwright.config.ts,apps/api/src/modules/whatsapp-webhook/infrastructure/agente-2/config.ts,apps/api/src/modules/whatsapp-webhook/infrastructure/agente-2/auth-gateway.ts,apps/api/src/modules/whatsapp-webhook/infrastructure/agente-2/tools.ts,apps/workers/src/agente-1/config.ts,apps/workers/src/agente-1/auth-gateway.ts,apps/workers/src/agente-1/tools.ts,apps/voice-agent/src/agente-3/config.ts,apps/voice-agent/src/agente-3/tools.ts,apps/api/src/modules/inspections/domain/mora-calculator.ts,apps/workers/src/mora-calculator.ts,apps/api/src/modules/whatsapp-webhook/infrastructure/deepgram/deepgram-speech-to-text.service.ts,apps/voice-agent/src/agente-3/infrastructure/deepgram-speech-to-text.service.ts,apps/panel-admin/src/app/core/models/inventory.models.ts,apps/pwa-logistica/src/app/core/models/inventory.models.ts,apps/panel-admin/src/app/core/inventory/inventory.service.ts,apps/pwa-logistica/src/app/core/inventory/inventory.service.ts,apps/panel-admin/src/app/features/inventory-panel/components/register-unit-modal/register-unit-modal.component.ts,apps/panel-admin/src/app/features/inventory-panel/components/register-unit-modal/register-unit-modal.component.html,apps/panel-admin/src/app/features/inventory-panel/components/register-unit-modal/register-unit-modal.component.spec.ts,apps/pwa-logistica/src/app/features/register-unit/register-unit.component.ts,apps/pwa-logistica/src/app/features/register-unit/register-unit.component.html,apps/pwa-logistica/src/app/features/register-unit/register-unit.component.spec.ts,apps/panel-admin/src/app/features/inventory-panel/components/general-tab/general-tab.component.ts,apps/pwa-logistica/src/app/features/unit-list/unit-list.component.ts

# Duplicación ACEPTADA/documentada (Sprint 15, QA — Issue #167): las 4
# familias de archivos backend de arriba (`config.ts`/`auth-gateway.ts`/
# `tools.ts` de los 3 agentes de IA, `mora-calculator.ts`,
# `deepgram-speech-to-text.service.ts`) son duplicación INTENCIONAL entre
# `apps/api`, `apps/workers` y `apps/voice-agent` — 3 deployables
# INDEPENDIENTES (CLAUDE.md §3: cada app del monorepo depende solo de
# `packages/`, nunca de otra app), cada gemelo ya tiene su propio doc-comment
# de cabecera explicando por qué no se fusiona (ver esos archivos).
#
# Agregado post-Sprint 15 (Issue #184, rediseño de fidelidad visual de
# panel-admin): mismo criterio pero entre `apps/panel-admin` y
# `apps/pwa-logistica` — dos remotes de Native Federation INDEPENDIENTES
# (no pueden compartir componentes/servicios entre sí, ver
# apps/pwa-logistica/src/app/core/inventory/inventory.service.ts doc-comment
# sobre por qué cada remote tiene su propia copia de los modelos de
# inventario desde Sprint 14) que terminaron con lógica de alta/listado de
# unidades muy similar (`register-unit-modal`/`register-unit`,
# `general-tab`/`unit-list`) por resolver la misma HU-13.1/13.2 para roles
# distintos (admin vs. almacenista).
#
# Esto es una mejora de la SEÑAL de SonarCloud, no del código: no se tocó
# ninguna lógica ni se fusionó nada. El resto del código del monorepo sigue
# bajo el Quality Gate de duplicación normal.
#
# NO incluido acá a propósito (deuda real, no duplicación intencional,
# pendiente como follow-up de Issue #167): `unit-detail.component.spec.ts`
# (pwa-logistica) duplica CONTRA SÍ MISMO (dos bloques de test casi
# idénticos) y `routes-today-tab.component.spec.ts` (panel-admin) duplica
# contra `e2e-bdd/steps/inventory.steps.ts` — ambos requieren extraer
# fixtures/helpers compartidos dentro de la misma app, no excluirlos.

# Coverage real (2026-08-27, pedido del Arquitecto) — hasta acá el proyecto
# corría en modo "Automatic Analysis" de SonarCloud, que hace solo análisis
# estático y nunca ejecuta tests, así que Coverage siempre daba "sin datos".
# `.github/workflows/ci.yml` ahora corre un scan CI-based (sonarqube-scan-action
# + SONAR_TOKEN) después de `pnpm turbo run test`, que ya deja generados los
# lcov.info de cada paquete (jest: collectCoverage:true ya seteado en cada
# jest.config.js; Angular: --code-coverage agregado al script "test" de cada
# app). Un scan CI-based con sonar.token hace que SonarCloud desactive
# Automatic Analysis para este proyecto automáticamente (no hace falta
# tocarlo a mano en la UI).
#
# sonar.organization es obligatorio en SonarCloud (a diferencia de SonarQube
# Server) — confirmado por el Arquitecto.
sonar.organization=xavierlop31
sonar.projectKey=Xavierlop31_ToolBoxJL

# Un solo path por app basta: el analizador JS/TS de SonarCloud usa la misma
# propiedad para .ts y .js desde que unificó los plugins javascript/typescript.
# Si un path no existe todavía (ej. una app cuyo PR de coverage no mergeó
# aún), sonar-scanner lo ignora con un warning, no falla el job.
#
# `packages/shared-types` (2026-09-01): tenía tests reales (Jest) pero nunca
# generaba lcov.info porque a su jest.config.js le faltaba `collectCoverage`/
# `coverageReporters` (mismo patrón ya aplicado en apps/api|workers|voice-agent)
# — Sonar lo reportaba en 0% aunque los tests existían y pasaban.
#
# `packages/ui-kit` NO está acá a propósito: corre bajo el test runner nativo
# de Node (`node --test`) sobre el `dist/` compilado, no sobre `src/*.ts` — el
# lcov que genera referencia rutas de `dist/`, que Sonar no puede mapear de
# vuelta al TypeScript fuente. Requeriría remapeo vía source maps (c8 u
# similar); dado que hoy es un solo archivo de tokens estáticos sin lógica de
# negocio, se prefirió excluirlo explícitamente (ver sonar.coverage.exclusions)
# antes que invertir en ese tooling por un archivo de 7 líneas declarativas.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/workers/coverage/lcov.info,apps/voice-agent/coverage/lcov.info,apps/shell/coverage/shell/lcov.info,apps/portal-cliente/coverage/portal-cliente/lcov.info,apps/panel-admin/coverage/panel-admin/lcov.info,apps/pwa-logistica/coverage/pwa-logistica/lcov.info,packages/shared-types/coverage/lcov.info

# Exclusiones de COVERAGE (2026-08-27, objetivo del Arquitecto: subir la
# cobertura real del 46.5% actual). Con coverage real recién habilitado,
# `search_files_by_coverage` mostró que buena parte de las líneas "sin
# cubrir" son archivos que NUNCA pueden tener cobertura de Jest/Karma por
# diseño, no por deuda técnica real:
# - `*.steps.ts` / `test/bdd/support/**`: corren bajo cucumber-js/Playwright
#   (procesos separados de Jest/Karma), no bajo `jest`/`ng test` — SÍ están
#   probados (son los escenarios Gherkin ejecutándose), Sonar simplemente no
#   puede instrumentarlos con el reporter de coverage que usa cada runner.
# - `*.config.js`/`karma.conf.js`/`playwright.config.ts`/`cucumber.cjs`:
#   config de herramientas (Angular CLI, ESLint, Native Federation, Karma,
#   Playwright, Cucumber), no lógica de negocio.
# - `environment*.ts`/`app.config.ts`/`app.routes.ts`/`entry.routes.ts`/
#   `main.ts` de las 4 apps Angular: boilerplate de wiring que genera el CLI,
#   una línea de `bootstrapApplication(...)` o un objeto de config estático.
# - `apps/api/prisma/migrations/**`: SQL, no código de aplicación.
# Deliberadamente NO se excluyen `*.config.ts` de negocio (ej.
# `pricing.config.ts`) ni `main.ts` de apps/api|workers|voice-agent (tienen
# lógica real de arranque) — esos siguen contando para el objetivo de 85%.
#
# `**/*.spec.ts`/`**/*.test.ts` (2026-09-01): faltaba excluirlos y Sonar los
# contaba como líneas propias a cubrir (un archivo de test no puede "cubrirse
# a sí mismo" — eso no es deuda técnica, es un hueco de config). Confirmado
# vía search_files_by_coverage: solo en la primera página de resultados
# (50/600 archivos) sumaban ~1354 líneas "sin cubrir" que eran specs, sobre
# 5496 sin cubrir en total — inflaba artificialmente el déficit de cobertura
# reportado (43.4%) sin relación con tests reales faltantes.
sonar.coverage.exclusions=**/*.steps.ts,**/test/bdd/support/**,**/*.config.js,**/karma.conf.js,**/playwright.config.ts,**/cucumber.cjs,**/environments/environment*.ts,apps/*/src/bootstrap.ts,apps/*/src/app/app.config.ts,apps/*/src/app/app.routes.ts,apps/*/src/app/remote-entry/entry.routes.ts,apps/shell/src/main.ts,apps/portal-cliente/src/main.ts,apps/panel-admin/src/main.ts,apps/pwa-logistica/src/main.ts,apps/api/prisma/migrations/**,**/*.spec.ts,**/*.test.ts,packages/ui-kit/src/tokens/design-tokens.ts
