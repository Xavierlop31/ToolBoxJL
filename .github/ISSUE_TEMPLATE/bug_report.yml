name: "🐞 Bug"
description: Reporta un defecto en algo ya implementado.
title: "BUG: "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué está pasando
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Idealmente, referencia el criterio de aceptación o escenario Gherkin que se está incumpliendo.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options: ["Local", "Preview (PR)", "Producción"]
    validations:
      required: true

  - type: input
    id: historia
    attributes:
      label: Historia de usuario / endpoint relacionado
      placeholder: "#N o /ruta/del/endpoint"
