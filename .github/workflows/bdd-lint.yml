name: BDD Lint (Gherkin)

# Gate de SDD (Plan de Implementación §1.1), etapa 1: valida que todo
# features/*.feature tiene sintaxis Gherkin válida. La etapa 2 (ejecutar los
# escenarios contra step definitions reales, p. ej. con Cucumber o
# Playwright-BDD) se activa módulo a módulo a medida que exista código de
# aplicación — hasta entonces, este job es el único gate posible.

on:
  pull_request:
    paths:
      - "features/**"
      - ".github/workflows/bdd-lint.yml"
  push:
    branches: [main]
    paths:
      - "features/**"
      - ".github/workflows/bdd-lint.yml"
  workflow_dispatch: {}

jobs:
  gherkin-syntax:
    name: Validar sintaxis Gherkin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Versiones fijadas a las mismas ya resueltas por @cucumber/cucumber en
      # pnpm-lock.yaml (workspace) — evita instalar código no auditado desde
      # un rango de versión sin fijar (githubactions:S8543/S8544) y bloquea
      # scripts de instalación arbitrarios de las dependencias transitivas
      # (githubactions:S6505); ninguno de estos dos paquetes usa postinstall.
      - name: Instalar validador
        run: npm install --no-save --ignore-scripts @cucumber/gherkin@30.0.4 @cucumber/messages@27.2.0

      - name: Validar features/*.feature
        run: node scripts/validate-gherkin.mjs
