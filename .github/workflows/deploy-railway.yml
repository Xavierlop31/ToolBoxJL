name: Deploy Railway

# Backend NestJS (Documento de Arquitectura §7) y Workers/Cron a Railway.
# `api` y `workers` son dos servicios del MISMO proyecto Railway, así que un
# único Project Token (RAILWAY_TOKEN) cubre ambos jobs.
#
# *** IMPORTANTE — por qué `railway up` corre desde la raíz del repo ***
# `railway up` sube el directorio actual como archivo de despliegue. Correrlo
# con `working-directory: apps/api` (como estaba antes) sube un `apps/api`
# huérfano: sin `pnpm-workspace.yaml`, sin `pnpm-lock.yaml` y sin
# `packages/shared-types`, con lo cual `"@toolboxjl/shared-types":
# "workspace:*"` es irresoluble y el build falla en Railway. Por eso se sube
# la raíz completa y cada servicio selecciona su app vía su archivo de
# config-as-code (`railway.api.json` / `railway.workers.json`), que hay que
# apuntar en Settings → Config-as-code de cada servicio en el dashboard.
#
# `railway up` respeta `.gitignore` por defecto, así que `node_modules/` y
# `dist/` no se suben.
#
# Se usa `--ci` en vez de `--detach`: `--detach` vuelve apenas el build se
# encola, así que un build roto en Railway dejaba este workflow en verde.
# `--ci` streamea los logs del build y sale con código distinto de 0 si falla.
#
# Nota: los `if` a nivel de job en GitHub Actions no pueden leer el contexto
# `secrets`, así que en vez de saltar el job entero, cada job siempre corre
# pero su primer paso comprueba si el secreto necesario existe y, si no,
# termina limpio (exit 0) en lugar de fallar en rojo.

#
# `workflow_dispatch` permite disparar el deploy a mano desde cualquier rama.
# Existe para poder VALIDAR este workflow (y la config de config-as-code y de
# variables de runtime de cada servicio en el dashboard) antes del merge
# `dev` → `main`, que es el gate semi-irreversible de cierre de sprint
# (CLAUDE.md §4). Sin esto, la primera ejecución real de un deploy a Railway
# sería justo en ese merge — un mal momento para descubrir que algo falla.
#
# *** Ojo: despliega la rama desde la que se dispara, al servicio REAL. ***
# Mientras no haya nada productivo corriendo en Railway, eso es exactamente lo
# que queremos. Cuando lo haya, este disparador debe restringirse (o quitarse).

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - "packages/**"
      - "railway.*.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Deploy apps/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que RAILWAY_SERVICE_ID_API existe
        id: check
        env:
          RAILWAY_SERVICE_ID_API: ${{ secrets.RAILWAY_SERVICE_ID_API }}
        run: |
          if [ -z "$RAILWAY_SERVICE_ID_API" ]; then
            echo "RAILWAY_SERVICE_ID_API no está configurado — omitiendo deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Versión fijada (githubactions:S8543/S8544 — evita instalar un rango
      # de versión sin resolver). NO se agrega --ignore-scripts acá
      # (githubactions:S6505) a propósito: el postinstall de @railway/cli
      # descarga el binario real de la CLI (no hay JS de fallback en
      # runtime, a diferencia de p. ej. esbuild) — con --ignore-scripts la
      # instalación queda en un estado roto ("could not find the CLI binary
      # at .../railway.exe"), verificado localmente antes de este cambio.
      - name: Instalar Railway CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g @railway/cli@5.43.4

      # El secret se pasa vía `env` y se referencia como variable de shell
      # ($RAILWAY_SERVICE_ID_API), nunca interpolado directo en el cuerpo del
      # script (githubactions:S7636 — un secreto con metacaracteres de shell
      # embebido en `${{ }}` dentro de `run:` puede inyectar comandos).
      #
      # Sin `working-directory`: se sube la raíz del monorepo (ver nota de
      # cabecera).
      - name: Deploy a Railway
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID_API: ${{ secrets.RAILWAY_SERVICE_ID_API }}
        run: railway up --service "$RAILWAY_SERVICE_ID_API" --ci

  workers:
    name: Deploy apps/workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que RAILWAY_SERVICE_ID_WORKERS existe
        id: check
        env:
          RAILWAY_SERVICE_ID_WORKERS: ${{ secrets.RAILWAY_SERVICE_ID_WORKERS }}
        run: |
          if [ -z "$RAILWAY_SERVICE_ID_WORKERS" ]; then
            echo "RAILWAY_SERVICE_ID_WORKERS no está configurado — omitiendo deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Ídem nota del job `api` (githubactions:S8543/S8544/S6505).
      - name: Instalar Railway CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g @railway/cli@5.43.4

      # Ídem nota de arriba (githubactions:S7636): secret vía `env`, nunca
      # interpolado directo en `run:`.
      - name: Deploy a Railway
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID_WORKERS: ${{ secrets.RAILWAY_SERVICE_ID_WORKERS }}
        run: railway up --service "$RAILWAY_SERVICE_ID_WORKERS" --ci
