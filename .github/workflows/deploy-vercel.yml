name: Deploy Vercel

# Un job por app Angular (Documento de Arquitectura §8): cada remote de
# Native Federation se despliega a su propio proyecto de Vercel de forma
# independiente. VERCEL_TOKEN y VERCEL_ORG_ID ya están configurados como
# secreto del repo.
#
# VERCEL_PROJECT_ID_<APP> se agrega como *Variable* (Settings → Secrets and
# variables → Actions → pestaña "Variables"), no como Secret: el Project ID
# de Vercel no es información sensible, y los `if` a nivel de job en GitHub
# Actions no pueden leer el contexto `secrets` (solo `vars`) — por eso cada
# job queda condicionado a que exista la Variable correspondiente, para no
# fallar en rojo antes de que crees el proyecto en Vercel.

#
# `workflow_dispatch` permite re-disparar el deploy a producción a mano,
# sin necesitar un commit nuevo — necesario porque estos deploys van vía
# CLI/API (esta Action, con VERCEL_TOKEN), no por la integración nativa de
# Git de Vercel: el botón "Redeploy" del dashboard de Vercel queda
# deshabilitado (candado) para deployments que no vinieron de esa
# integración. Casos típicos: cambiaste una Environment Variable en Vercel
# (Settings → Environment Variables) y necesitás que el próximo build la
# recoja, sin esperar al siguiente push a main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Deploy shell
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_PROJECT_ID_SHELL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vercel-app
        with:
          app-path: apps/shell
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_SHELL }}
          production: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  portal-cliente:
    name: Deploy portal-cliente
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_PROJECT_ID_PORTAL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vercel-app
        with:
          app-path: apps/portal-cliente
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_PORTAL }}
          production: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  panel-admin:
    name: Deploy panel-admin
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_PROJECT_ID_ADMIN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vercel-app
        with:
          app-path: apps/panel-admin
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
          production: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  pwa-logistica:
    name: Deploy pwa-logistica
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_PROJECT_ID_PWA != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vercel-app
        with:
          app-path: apps/pwa-logistica
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_PWA }}
          production: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
