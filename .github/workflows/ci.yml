name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Lint, test y build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La versión de pnpm se toma del campo "packageManager" de package.json
      # (pnpm@9.15.0) — no se repite aquí para evitar el error
      # ERR_PNPM_BAD_PM_VERSION por versiones duplicadas.
      # SHA completo del commit de la tag v4 (githubactions:S7637 — hardening
      # de supply chain: pinear a un commit inmutable en vez de una tag
      # mutable). Resuelto con `gh api repos/pnpm/action-setup/commits/v4`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --ignore-scripts (githubactions:S6505) evita ejecutar scripts de
      # instalación arbitrarios de dependencias de terceros. El único
      # postinstall real del workspace es el de apps/api (`prisma generate`,
      # ver apps/api/package.json) — se ejecuta explícitamente en el paso
      # siguiente en vez de dejar que corra automáticamente.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generar Prisma Client (apps/api)
        run: pnpm --filter @toolboxjl/api exec prisma generate

      # Sprint 1 en adelante: apps con Playwright-BDD (portal-cliente,
      # pwa-logistica) instalan Chromium + dependencias de sistema en su
      # propio script de test. Si turbo corre esos tests en paralelo, dos
      # `playwright install --with-deps` chocan por el lock de apt
      # ("Could not get lock /var/lib/apt/lists/lock"). Se instala una sola
      # vez acá, antes de turbo — el binario y las deps de sistema quedan
      # cacheados y cada `playwright install` posterior es un no-op rápido.
      # `npx playwright` no resuelve el binario porque `playwright` no es
      # dependencia de la raiz del workspace (solo de portal-cliente y
      # pwa-logistica) — se invoca explicitamente desde un paquete que lo
      # tiene instalado; el cache de Chromium/deps de sistema es global al
      # runner, asi que igual cubre a ambas apps.
      #
      # Nota SonarCloud (githubactions:S6505): esta línea no es un
      # `npm install`/`pnpm install` de paquetes del registro — es el
      # subcomando propio de Playwright que descarga binarios de Chromium
      # (verificados por checksum, servidos por la CDN de Playwright) y
      # paquetes de sistema vía apt. No ejecuta scripts de lifecycle de
      # dependencias de terceros, así que `--ignore-scripts` no aplica acá
      # (ni Playwright ni `pnpm exec` lo interpretan como tal para este
      # subcomando) — se deja sin cambios a propósito.
      - name: Instalar Chromium + deps de sistema para Playwright (una sola vez)
        run: pnpm --filter portal-cliente exec playwright install --with-deps chromium

      # Sprint 0 en adelante: a medida que existan apps/* y packages/*, este
      # comando afecta solo los paquetes cambiados respecto a la rama base del
      # PR (main o dev, segun corresponda) — de ahi que el checkout use
      # fetch-depth: 0 (si no, origin/<base> no existe en el runner y turbo
      # falla con "Unable to query SCM"). Antes de Sprint 0 (sin workspaces
      # reales) turbo no encuentra tareas y termina en 0, sin marcar el job
      # en rojo.
      - name: Lint, test y build de los paquetes afectados
        run: pnpm turbo run lint test build --filter=...[origin/${{ github.base_ref }}]
        if: github.event_name == 'pull_request'

      - name: Lint, test y build (rama main completa)
        run: pnpm turbo run lint test build
        if: github.event_name == 'push'

      # CI-based analysis (2026-08-27) — reemplaza el "Automatic Analysis" de
      # SonarCloud (que nunca corría tests, por eso Coverage daba "sin
      # datos"). Solo en push: los lcov.info de este paso son los que generó
      # el "turbo run test" de arriba (jest: collectCoverage:true en cada
      # jest.config.js; Angular: --code-coverage en el script "test" de cada
      # app) — no hace falta un paso aparte para generarlos. SHA fijo del
      # commit de la tag v5 (mismo criterio de hardening que
      # pnpm/action-setup arriba, githubactions:S7637).
      #
      # El Arquitecto desactivó "Automatic Analysis" en SonarCloud
      # (Administration > Analysis Method, 2026-08-27) — el `continue-on-error`
      # que tuvo este paso mientras tanto (commit c6e4f10) ya no hace falta:
      # el scan corrió limpio contra main con Automatic Analysis apagado y
      # subió coverage real por primera vez (46.5%, antes "sin datos").
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
