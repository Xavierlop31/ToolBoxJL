name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Lint, test y build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # La versión de pnpm se toma del campo "packageManager" de package.json
      # (pnpm@9.15.0) — no se repite aquí para evitar el error
      # ERR_PNPM_BAD_PM_VERSION por versiones duplicadas.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Sprint 0 en adelante: a medida que existan apps/* y packages/*, este
      # comando afecta solo los paquetes cambiados respecto a main (--filter).
      # Antes de Sprint 0 (sin workspaces reales) turbo no encuentra tareas y
      # termina en 0, sin marcar el job en rojo.
      - name: Lint, test y build de los paquetes afectados
        run: pnpm turbo run lint test build --filter=...[origin/main]
        if: github.event_name == 'pull_request'

      - name: Lint, test y build (rama main completa)
        run: pnpm turbo run lint test build
        if: github.event_name == 'push'
