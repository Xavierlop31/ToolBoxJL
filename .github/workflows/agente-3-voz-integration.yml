name: Agente 3 (Voz) — Anthropic/Deepgram/ElevenLabs/LiveKit Integration

# Issues #26/#27 (HU-10.1/10.2) — valida las credenciales reales que usa el
# Agente 3 (tool calling de Claude, transcripción Deepgram, síntesis
# ElevenLabs, autenticación contra el proyecto LiveKit) contra sus APIs
# reales, no los mocks/fakes que usan los tests unitarios/BDD. Job separado
# del pipeline principal (ci.yml) a propósito, mismo criterio que
# agente-1-ruteo-integration.yml/agente-2-whatsapp-integration.yml.
#
# *** Secrets bajo el scope de GitHub "Agents" (no "Actions") *** — CLAUDE.md
# §8: ANTHROPIC_API_KEY/GEMINI_API_KEY/NVIDIA*_API_KEY viven en un
# Environment de GitHub llamado "Agents", distinto del contexto `secrets` a
# nivel de repo que usan agente-1-ruteo-integration.yml/
# agente-2-whatsapp-integration.yml (esos workflows son de sprints
# anteriores a esa reorganización de secrets — no se tocan acá, es una
# observación para el Tech Lead, no algo de este sprint). Por eso el job de
# abajo declara `environment: Agents`: sin esa declaración, `secrets.*` NO
# resuelve los secrets guardados en ese Environment.
#
# Nota (mismo criterio que los otros workflows de integración del repo): un
# `if` a nivel de job no puede leer el contexto `secrets`, así que el job
# siempre corre pero su primer paso comprueba si ALGUNA credencial existe y,
# si ninguna existe, termina limpio (exit 0) en vez de fallar en rojo —
# relevante para forks de PR externos. Si solo ALGUNAS credenciales existen,
# el test las corre igual: cada bloque (Anthropic/Deepgram/ElevenLabs/
# LiveKit) se auto-salta de forma independiente si a ESA credencial puntual
# le falta el secret (ver test/integration/agente-3-voz.integration.spec.ts).

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/voice-agent/**"
      - ".github/workflows/agente-3-voz-integration.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/voice-agent/**"
      - ".github/workflows/agente-3-voz-integration.yml"
  workflow_dispatch: {}

concurrency:
  group: agente-3-voz-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agente-3-real-apis:
    name: Validar Agente 3 contra Anthropic/Deepgram/ElevenLabs/LiveKit reales
    runs-on: ubuntu-latest
    environment: Agents
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que al menos una credencial existe
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$DEEPGRAM_API_KEY" ] && [ -z "$ELEVENLABS_API_KEY" ] && [ -z "$LIVEKIT_API_KEY" ]; then
            echo "Ninguna credencial del Agente 3 está configurada — omitiendo validación real."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.check.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        if: steps.check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Secrets SIEMPRE vía `env:`, nunca interpolados en el cuerpo de
      # `run:` (githubactions:S7636, mismo hardening que el resto del repo).
      - name: Validar credenciales reales del Agente 3
        if: steps.check.outputs.skip == 'false'
        working-directory: apps/voice-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: pnpm run test:integration:agente3
